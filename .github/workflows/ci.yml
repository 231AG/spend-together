name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo caching can mask a real failure on the protected branch (F0 risk
  # table), so main runs uncached.
  TURBO_FORCE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verify custom lint rules fire
        run: pnpm lint:rules

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build in live API mode
        # Proves the contract-first switch stays wired even before a backend
        # exists (ADR-002). Both modes must always build.
        run: pnpm build
        env:
          NEXT_PUBLIC_API_MODE: live
