name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_MODE: mock
      # Never trust the Turborepo cache on main (F0 risk: caching masking a failure).
      TURBO_FORCE: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # F2 exit criterion 2: 100% line and branch coverage on packages/domain.
      - run: pnpm test:domain
      - run: pnpm build
      # F4: the dev scenario switcher must never reach a production bundle.
      - run: pnpm --filter @spendtogether/web assert-prod-bundle
      # F3: the Storybook build is the design-system review artefact; it must always build.
      - run: pnpm --filter @spendtogether/web build-storybook
      # F5: browser tests (history through route dialogs, redirects, keyboard, axe) at
      # 360 / 768 / 1280 px against the production build in mock mode.
      - run: pnpm --filter @spendtogether/web exec playwright install --with-deps chromium
      - run: pnpm --filter @spendtogether/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
